//file:noinspection SpellCheckingInspection
plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'groovy'
    id 'idea'
    id "org.sonarqube" version "6.0.1.5171"
    id "info.solidsoft.pitest" version "1.19.0"
}

group = 'com.rox'
version = '1.0-SNAPSHOT'
description = '6502 Emulator'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.rox.emu.processor.mos6502.dbg.ui.DebuggerWindow'
}

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

dependencies {
    testImplementation 'org.apache.groovy:groovy:4.0.28'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'

    testImplementation 'org.quicktheories:quicktheories:0.13'
    testImplementation 'com.github.richard-melvin:junit-theory-suite:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'

    testImplementation 'com.pholser:junit-quickcheck-core:0.8-alpha-7'
    testImplementation 'com.pholser:junit-quickcheck-generators:0.8-alpha-7'

    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'com.nagternal:spock-genesis:0.6.0'
    testImplementation 'org.mockito:mockito-core:5.20.0'

    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:slf4j-reload4j:2.0.17'
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test

    reports {
        xml {
            required = true
            outputLocation = layout.buildDirectory.file("reports/jacoco/jacocoTestReport.xml")
        }
    }

    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude '**/ui/**'
    })
}

pitest {
    junit5PluginVersion = '1.2.2'
    excludedClasses = ['com.rox.emu.processor.mos6502.dbg.ui.*']
    outputFormats = ['XML','HTML']
    timestampedReports = false
    //mutators = ['ALL']
}

tasks.register('runDebugUI', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
}

jar {
    //Include third party dependencies
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes 'Main-Class': 'com.rox.emu.processor.mos6502.dbg.ui.DebuggerWindow'
    }
}
 
